<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joshua's Monitor Comparison Tool</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>Joshua's Monitor Comparison Tool</h1>

<div class="axis-controls" id="axisControls"></div>

<div class="outer-wrapper">
  <div class="y-axis-title" id="yAxisTitle">Vertical Pixels &#8594;</div>
  <div class="y-labels-col" id="yLabelsCol"></div>
  <div class="chart-and-x">
    <div class="chart-container" id="chart">
      <div class="chart-area" id="chartArea"></div>
    </div>
    <div class="x-axis-title" id="xAxisTitle">Horizontal Pixels &#8594;</div>
  </div>
  <div id="filterPanel"></div>
</div>

<div class="tooltip" id="tooltip">
  <div class="tt-name" id="ttName"></div>
  <div class="tt-detail" id="ttDetail"></div>
</div>

<div class="legend" id="legend"></div>


<div class="panels-row">
  <div id="monitorPanel"></div>
  <div id="mpPanel"></div>
  <div id="areaPanel"></div>
  <div id="ppiPanel"></div>
  <div id="ratioPanel"></div>
</div>

<script src="app.js"></script>
</body>
</html>
