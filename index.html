<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor Comparison</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>Monitor Comparison</h1>

<div class="axis-controls" id="axisControls"></div>

<div class="outer-wrapper">
  <div class="y-axis-title" id="yAxisTitle">Vertical Pixels &#8594;</div>
  <div class="y-labels-col" id="yLabelsCol"></div>
  <div class="chart-and-x">
    <div class="chart-container" id="chart">
      <div class="chart-area" id="chartArea"></div>
    </div>
    <div class="x-axis-title" id="xAxisTitle">Horizontal Pixels &#8594;</div>
  </div>
  <div id="filterPanel"></div>
</div>

<div class="tooltip" id="tooltip">
  <div class="tt-name" id="ttName"></div>
  <div class="tt-detail" id="ttDetail"></div>
</div>

<div class="legend" id="legend"></div>

<div class="note" id="noteBar">
  <span class="note-item" id="noteRatio">--- diagonal = aspect ratio</span>
  <span class="note-sep" id="noteSep1"></span>
  <span class="note-item" id="noteMp">~~~ curve = same megapixels</span>
  <span class="note-sep" id="noteSep2"></span>
  <span class="note-item" id="noteArea" style="display:none">~~~ curve = same screen area</span>
  <span class="note-sep" id="noteSep3"></span>
  <span class="note-item">click badges to fan out clusters</span>
</div>

<div class="panels-row">
  <div id="monitorPanel"></div>
</div>
<div class="panels-row">
  <div id="ratioPanel"></div>
  <div id="mpPanel"></div>
  <div id="areaPanel"></div>
</div>

<script src="app.js"></script>
</body>
</html>
